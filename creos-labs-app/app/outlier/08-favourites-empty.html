<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Favourites</title>
<style>
body{margin:0;background:#0B0B0A}
a{color:#F2F0EA;text-decoration:none}a:hover{color:#FFD60A}
summary::-webkit-details-marker{display:none}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.disp{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-0.035em}

</style>
</head>
<body>
<div style="min-height: 900px; box-sizing: border-box; background: #0B0B0A; color: #F2F0EA; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<header style="position: sticky; top: 0; z-index: 5; background: rgba(11,11,10,0.92); border-bottom: 1px solid #2A2925">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 28px">
<div style="display: flex; align-items: center; gap: 12px"><a href="#workspace" style="display: flex; align-items: center; gap: 10px" aria-label="Creos Labs workspace"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke-width="3.2" stroke-linecap="square"><path d="M12 12V2.5M12 12L3.8 7.2M12 12l8.2-4.8" stroke="#F2F0EA"></path><path d="M12 12v9.5M12 12l-8.2 4.8M12 12l8.2 4.8" stroke="#FFD60A"></path></g></svg><span class="disp" style="font-size: 16px; letter-spacing: 0">CREOS LABS</span></a><span style="color: #4A4943; font-size: 18px">/</span><button type="button" aria-label="Switch product" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3934; background: transparent; color: #F2F0EA; font: inherit; cursor: pointer"><span class="emo" style="font-size: 14px">🔭</span><span class="disp" style="font-size: 15px; letter-spacing: 0">Outlier</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A978F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg></button></div>
<nav style="display: flex; align-items: center; gap: 24px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em"><a href="#home" style="position: relative; display: inline-flex; align-items: center; height: 64px; color: #F2F0EA">Home<span style="position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #FFD60A"></span></a><a href="#feed" style="position: relative; display: inline-flex; align-items: center; height: 64px; color: #9A978F">Feed</a><a href="#trends" style="position: relative; display: inline-flex; align-items: center; height: 64px; color: #9A978F">Trends</a><a href="#creators" style="position: relative; display: inline-flex; align-items: center; height: 64px; color: #9A978F">Creators</a><a href="#progress" style="position: relative; display: inline-flex; align-items: center; height: 64px; color: #9A978F">Progress</a></nav>
<div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
<button type="button" style="display: inline-flex; align-items: center; gap: 10px; height: 36px; width: 220px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3934; background: #151513; color: #9A978F; font: inherit; font-size: 13px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A978F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span>Search</span><span class="mono" style="margin-left: auto; font-size: 10px; border: 1px solid #3A3934; padding: 2px 6px; border-radius: 6px">⌘K</span></button>
<button type="button" aria-label="Notifications" style="position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #3A3934; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: #FFD60A"></span></button>
<button type="button" aria-label="Account menu" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid #3A3934; background: transparent; color: #F2F0EA; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><div style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1px solid #3A3934; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #0B0B0A; letter-spacing: 0.04em">J</div>Jackson</button>
</div></div></header>
<main style="max-width: 1360px; margin: 0 auto; padding: 40px 32px 80px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px"><div style="display: flex; flex-direction: column; gap: 14px"><span class="mono" style="font-size: 11px; color: #FFD60A">Favourites</span><h1 class="disp" style="margin: 0; font-size: 52px; line-height: 0.92">Saved posts.</h1><p style="margin: 0; font-size: 16px; color: #B9B6AE; line-height: 1.5; max-width: 640px">0 saved · 0 collections</p></div><div style="display: flex; flex-wrap: wrap; gap: 10px"></div></div><div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 72px 24px; text-align: center; background: #151513; border: 1px dashed #3A3934; border-radius: 24px"><div style="position: relative; width: 220px; height: 160px"><div style="position: relative; width: 100px; height: 150px; flex: none; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 80% at 30% 20%, #34322C 0%, #1A1917 55%, #0F0F0E 100%); display: flex; align-items: center; justify-content: center; position: absolute; left: 0; top: 10px; transform: rotate(-8deg); opacity: 0.6"><span class="emo" style="font-size: 30px">🛹</span><span class="disp" style="position: absolute; left: 10px; bottom: 10px; font-size: 18px; letter-spacing: -0.02em; padding: 5px 9px; border-radius: 10px; background: #FFD60A; color: #0B0B0A">79.0×</span></div><div style="position: relative; width: 100px; height: 150px; flex: none; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 80% at 30% 20%, #34322C 0%, #1A1917 55%, #0F0F0E 100%); display: flex; align-items: center; justify-content: center; position: absolute; left: 60px; top: 0; z-index: 1; box-shadow: 0 0 0 2px #FFD60A"><span class="emo" style="font-size: 30px">🧔🏻</span><span class="disp" style="position: absolute; left: 10px; bottom: 10px; font-size: 18px; letter-spacing: -0.02em; padding: 5px 9px; border-radius: 10px; background: #FFD60A; color: #0B0B0A">120.4×</span></div><div style="position: relative; width: 100px; height: 150px; flex: none; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 80% at 30% 20%, #34322C 0%, #1A1917 55%, #0F0F0E 100%); display: flex; align-items: center; justify-content: center; position: absolute; left: 120px; top: 10px; transform: rotate(8deg); opacity: 0.6"><span class="emo" style="font-size: 30px">💐</span><span class="disp" style="position: absolute; left: 10px; bottom: 10px; font-size: 18px; letter-spacing: -0.02em; padding: 5px 9px; border-radius: 10px; background: #FFD60A; color: #0B0B0A">20.7×</span></div><span class="emo" style="position: absolute; right: 18px; top: -14px; font-size: 30px; z-index: 2">⭐</span></div><h2 class="disp" style="margin: 16px 0 0; font-size: 32px">No favourites yet.</h2><p style="margin: 0; font-size: 15px; color: #B9B6AE; max-width: 420px; line-height: 1.5">Star a post from its page to save it here. Group favourites into collections — “hooks to steal”, “Q4 ideas” — when you have a few.</p><div style="display: flex; gap: 10px"><a href="#feed" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; background: #FFD60A; color: #0B0B0A; border: 1px solid #FFD60A"><span>Browse top outliers</span></a><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; background: transparent; color: #F2F0EA; border: 1px solid #3A3934"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F2F0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>New collection</span></button></div></div>
</main>
</div>
</body>
</html>
